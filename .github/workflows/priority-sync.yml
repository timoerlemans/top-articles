name: Synchroniseer Readwise-prioriteit

run-name: Readwise maintenance ${{ inputs.request_id || 'scheduled' }}

on:
  schedule:
    - cron: "0 4 * * *" # dagelijks om 04:00 UTC (~06:00 CEST, ~05:00 CET — cron kent geen DST)
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unieke ID voor expliciete dispatch en run-correlatie"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: readwise-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Readwise CLI
        run: npm install -g @readwise/cli@0.5.9

      - name: Log in to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
        run: readwise login-with-token "$READWISE_TOKEN"

      - name: Run tests
        run: npm run check

      - name: Ensure operational fallback judgments
        run: npm run priority:judge -- ensure-fallback --all-later --report .tmp/readwise/priority-judge-audit.json

      - name: Bewaar gewijzigde fallback-configuratie
        run: |
          if git diff --quiet -- config/readwise-priority-judgments.json; then
            echo "Geen nieuwe fallback-judgments"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/readwise-priority-judgments.json
          git commit -m "chore: registreer automatische priority judgments"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Maak maintenance-manifest
        run: npm run readwise:priority-sync -- plan --output .tmp/readwise/maintenance-plan.json

      - name: Voer auteurstags en priority-sync uit
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            confirmations=$(jq -r '[.stages[] | select(.mutations == true and (.confirmationRequired // true) == true) | "\(.stage)=\(.planHash)"] | join(",")' .tmp/readwise/maintenance-plan.json)
            if [ -n "$confirmations" ]; then
              npm run readwise:priority-sync -- apply --through priority --plan .tmp/readwise/maintenance-plan.json --confirm "$confirmations" --report .tmp/readwise/maintenance-report.json
            else
              npm run readwise:priority-sync -- apply --through priority --plan .tmp/readwise/maintenance-plan.json --report .tmp/readwise/maintenance-report.json
            fi
            status=$(jq -r '.status' .tmp/readwise/maintenance-report.json)
            if [ "$status" = "verified" ]; then
              exit 0
            fi
            if [ "$status" != "awaiting-confirmation" ]; then
              echo "Maintenance stopte met status: $status" >&2
              exit 1
            fi
            echo "Maintenance werd opnieuw gepland na een upstream-mutatie (ronde $attempt)."
          done
          echo "Maintenance vereiste meer dan vijf replanningrondes." >&2
          exit 1

      - name: Schrijf samenvatting
        if: always()
        run: |
          {
            echo "### Readwise-prioriteit synchronisatie"
            if [ -f .tmp/readwise/priority-judge-audit.json ]; then
              jq -r '"- Fallback-documenten: \(.top100)\n- Nieuw: \((.added // []) | length)\n- Bestaand: \((.existing // []) | length)\n- Bestaande operationele fallback: \((.fallback // []) | length)\n- Stale: \((.stale // []) | length)\n- Draft: \((.draft // []) | length)\n- Rejected: \((.rejected // []) | length)"' .tmp/readwise/priority-judge-audit.json
            fi
            if [ -f .tmp/readwise/priority-plan.json ]; then
              jq -r '"- Documenten: \(.summary.documents)\n- Toevoegingen: \(.summary.additions)\n- Verwijderingen: \(.summary.removals)\n- Planhash: `\(.planHash)`"' .tmp/readwise/priority-plan.json
              echo
              if jq -e '((.top100Entries // []) + (.top100Exits // [])) | length > 0' .tmp/readwise/priority-plan.json > /dev/null; then
                jq -r '
                  (.top100Entries // []) as $entries
                  | (.top100Exits // []) as $exits
                  | (([$entries[]?.category] + [$exits[]?.category]) | unique[]) as $category
                  | "## " + $category + "\n"
                    + (([$entries[] | select(.category == $category) | "- " + (.position|tostring) + "/100 - " + .title]
                        + [$exits[] | select(.category == $category) | "- valt weg" + (if .position == null then "" else " (" + (.position|tostring) + "/100)" end) + " - " + .title])
                       | join("\n"))
                ' .tmp/readwise/priority-plan.json
              else
                echo "Geen nieuwe of weggevallen top-100-items."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bewaar chain-context
        if: always()
        run: |
          mkdir -p .tmp/readwise
          jq -n \
            --arg workflow "${{ github.workflow }}" \
            --arg runId "${{ github.run_id }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg initialSha "${{ github.sha }}" \
            --arg finalSha "$(git rev-parse HEAD)" \
            --arg status "${{ job.status }}" \
            '{version: 1, workflow: $workflow, runId: $runId, parentRunId: null, branch: $branch, initialSha: $initialSha, finalSha: $finalSha, status: $status}' \
            > .tmp/readwise/maintenance-run.json

      - name: Bewaar plan, journal en chain-context bij falen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readwise-maintenance-root-${{ github.run_id }}
          path: .tmp/readwise/*.json
          if-no-files-found: ignore
          retention-days: 14
