name: Refresh Readwise data

on:
  schedule:
    - cron: "0 4 * * *" # dagelijks om 04:00 UTC (~06:00 CEST, ~05:00 CET — cron kent geen DST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: readwise-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript source
        run: npm run check

      - name: Install Readwise CLI
        run: npm install -g @readwise/cli@0.5.9

      - name: Log in to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
        run: readwise login-with-token "$READWISE_TOKEN"

      - name: Ensure operational fallback judgments
        run: npm run priority:judge -- ensure-fallback --all-later --report .tmp/readwise/priority-judge-audit.json

      - name: Build app data
        run: npm run build

      - name: Commit changes if any
        run: |
          if git diff --quiet -- config/readwise-priority-judgments.json data/data.js data/score.js dist/src; then
            echo "Geen wijzigingen in fallback-configuratie of gegenereerde browser- en Readwise-data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/readwise-priority-judgments.json data/data.js data/score.js dist/src
          git commit -m "chore: ververs Readwise-data en judgments"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Schrijf samenvatting
        if: always()
        run: |
          {
            echo "### Readwise refresh"
            if [ -f .tmp/readwise/priority-judge-audit.json ]; then
              jq -r '"- Fallback-documenten: \(.top100)\n- Nieuw: \((.added // []) | length)\n- Bestaand: \((.existing // []) | length)\n- Stale: \((.stale // []) | length)\n- Draft: \((.draft // []) | length)\n- Rejected: \((.rejected // []) | length)"' .tmp/readwise/priority-judge-audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bewaar fallback-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-readwise-debug-${{ github.run_id }}
          path: .tmp/readwise/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Send top-1 email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node dist/scripts/send-top1-email.js
