name: Refresh Readwise data

on:
  schedule:
    - cron: "0 6 * * *" # dagelijks om 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Readwise CLI
        run: npm install -g @readwise/cli

      - name: Log in to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
        run: readwise login-with-token "$READWISE_TOKEN"

      - name: Build app data
        run: npm run build

      - name: Commit changes if any
        run: |
          if git diff --quiet -- data/data.js data/score.js; then
            echo "Geen wijzigingen in data/data.js of data/score.js"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.js data/score.js
          git commit -m "chore: ververs Readwise-data"
          git push
