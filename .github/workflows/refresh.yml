name: Refresh Readwise data

run-name: Readwise refresh na ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Cleanup archived Readwise-tags"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: readwise-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download parent context
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: readwise-maintenance-cleanup-${{ github.event.workflow_run.id }}
          path: .chain

      - name: Resolve parent checkout
        id: parent_context
        run: |
          set -euo pipefail
          final_sha=$(jq -r '.finalSha' .chain/maintenance-run.json)
          branch=$(jq -r '.branch' .chain/maintenance-run.json)
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          test -n "$branch"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.parent_context.outputs.final_sha }}
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript source
        run: npm run check

      - name: Install Readwise CLI
        run: npm install -g @readwise/cli@0.5.9

      - name: Log in to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
        run: readwise login-with-token "$READWISE_TOKEN"

      - name: Ensure operational fallback judgments
        run: npm run priority:judge -- ensure-fallback --all-later --report .tmp/readwise/priority-judge-audit.json

      - name: Build app data
        run: npm run build

      - name: Commit changes if any
        run: |
          if git diff --quiet -- config/readwise-priority-judgments.json data/data.js data/score.js dist/src index.html; then
            echo "Geen wijzigingen in fallback-configuratie of gegenereerde browser- en Readwise-data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/readwise-priority-judgments.json data/data.js data/score.js dist/src index.html
          git commit -m "chore: ververs Readwise-data en judgments"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ steps.parent_context.outputs.branch }}"; then
              exit 0
            fi
            git fetch origin "${{ steps.parent_context.outputs.branch }}"
            git rebase "origin/${{ steps.parent_context.outputs.branch }}"
          done
          exit 1

      - name: Schrijf samenvatting
        if: always()
        run: |
          {
            echo "### Readwise refresh"
            if [ -f .tmp/readwise/priority-judge-audit.json ]; then
              jq -r '"- Fallback-documenten: \(.top100)\n- Nieuw: \((.added // []) | length)\n- Bestaand: \((.existing // []) | length)\n- Bestaande operationele fallback: \((.fallback // []) | length)\n- Stale: \((.stale // []) | length)\n- Draft: \((.draft // []) | length)\n- Rejected: \((.rejected // []) | length)"' .tmp/readwise/priority-judge-audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bewaar fallback-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-readwise-debug-${{ github.run_id }}
          path: .tmp/readwise/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Send top-1 email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node dist/scripts/send-top1-email.js

      - name: Bewaar chain-context
        if: always()
        run: |
          jq -n \
            --arg workflow "${{ github.workflow }}" \
            --arg runId "${{ github.run_id }}" \
            --arg parentRunId "${{ github.event.workflow_run.id }}" \
            --arg branch "${{ steps.parent_context.outputs.branch }}" \
            --arg initialSha "${{ github.event.workflow_run.head_sha }}" \
            --arg finalSha "$(git rev-parse HEAD)" \
            --arg status "${{ job.status }}" \
            '{version: 1, workflow: $workflow, runId: $runId, parentRunId: $parentRunId, branch: $branch, initialSha: $initialSha, finalSha: $finalSha, status: $status}' \
            > .tmp/readwise/maintenance-run.json

      - name: Bewaar refresh- en chain-context-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readwise-maintenance-refresh-${{ github.run_id }}
          path: .tmp/readwise/*.json
          if-no-files-found: ignore
          retention-days: 14
