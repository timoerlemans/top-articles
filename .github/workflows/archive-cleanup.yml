name: Cleanup archived Readwise-tags

run-name: Readwise cleanup na ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Archiveer niet-beschermde Readwise-Later-documenten"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: readwise-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download parent context
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: readwise-maintenance-archive-${{ github.event.workflow_run.id }}
          path: .chain

      - name: Resolve parent checkout
        id: parent_context
        run: bash .github/scripts/resolve-parent-context.sh .chain/maintenance-run.json

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.parent_context.outputs.final_sha }}
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Readwise CLI
        run: npm install -g @readwise/cli@0.5.9

      - name: Log in to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
        run: readwise login-with-token "$READWISE_TOKEN"

      - name: Run checks
        run: npm run check

      - name: Maak archive cleanup-plan
        id: cleanup_plan
        run: |
          npm run archive:cleanup:plan -- --output .tmp/readwise/archive-cleanup-plan.json
          echo "operations=$(jq -r '.summary.operations' .tmp/readwise/archive-cleanup-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Pas archive cleanup-plan toe
        if: steps.cleanup_plan.outputs.operations != '0'
        run: |
          PLAN_HASH=$(jq -r '.planHash' .tmp/readwise/archive-cleanup-plan.json)
          npm run archive:cleanup:apply -- --plan .tmp/readwise/archive-cleanup-plan.json --confirm "$PLAN_HASH"

      - name: Verifieer archive cleanup
        if: steps.cleanup_plan.outputs.operations != '0'
        run: npm run archive:cleanup:verify

      - name: Schrijf samenvatting
        if: always()
        run: |
          if [ -f .tmp/readwise/archive-cleanup-plan.json ]; then
            {
              echo "### Readwise archive cleanup"
              jq -r '"- Archive-documenten: \(.summary.documents)\n- Gewijzigde documenten: \(.summary.changedDocuments)\n- Verwijderingen: \(.summary.removals)\n- Planhash: `\(.planHash)`"' .tmp/readwise/archive-cleanup-plan.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bewaar chain-context
        if: always()
        env:
          MAINTENANCE_RUN_FILE: .tmp/readwise/maintenance-run.json
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ steps.parent_context.outputs.branch }}
          INITIAL_SHA: ${{ github.event.workflow_run.head_sha }}
          STATUS: ${{ job.status }}
        run: |
          FINAL_SHA="$(git rev-parse HEAD)" bash .github/scripts/write-maintenance-run.sh

      - name: Bewaar cleanup-plan, journal en chain-context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readwise-maintenance-cleanup-${{ github.run_id }}
          path: .tmp/readwise/*.json
          if-no-files-found: ignore
          retention-days: 14
